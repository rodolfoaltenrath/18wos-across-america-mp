[package]
name = "asset_tools"
default-run = "asset_tools"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
mod_ui = { path = "../mod_ui" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2 = "0.10"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "dds"] }
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
